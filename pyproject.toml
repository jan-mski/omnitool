[project]
name = "omnitool"
version = "0.2.0"
description = ""
authors = [
    {name = "jan-mski", email = "jm.alias.github.engross002@passmail.net"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings (>=2.8.1,<3.0.0)",
    "typer (>=0.16.0,<0.17.0)",
    "questionary (>=2.1.0,<3.0.0)",
]

[project.optional-dependencies]
git-plugin = [
    "dulwich>=0.21.0",
]

[project.scripts]
omnitool = "omnitool.main:cli.app"

[project.entry-points."omnitool.plugin"]
git = "omnitool.builtin_plugins.git.plugin:definition"

[dependency-groups]
dev = [
    "ipython>=9.4.0",
    "pytest>=8.3.5,<9.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
