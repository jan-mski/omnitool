[project]
name = "omnitool"
version = "0.2.0"
description = ""
authors = [
    {name = "jan-mski",email = "36985396+jan-mski@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings (>=2.8.1,<3.0.0)",
    "omnitool-git-plugin @ git+ssh://git@github.com/jan-mski/omnitool-git-plugin.git@omn-17",
    "typer (>=0.16.0,<0.17.0)",
    "questionary (>=2.1.0,<3.0.0)",
]

[project.scripts]
omnitool = "omnitool.main:cli.app"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
