[project]
name = "omnitool"
version = "0.2.0"
description = ""
authors = [
    { name = "jan-mski", email = "36985396+jan-mski@users.noreply.github.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings (>=2.8.1,<3.0.0)",
    "typer (>=0.16.0,<0.17.0)",
    "questionary (>=2.1.0,<3.0.0)",
    "pygit2 (>=1.15.0,<2.0.0)",
]

[project.scripts]
omnitool = "omnitool.main:cli.app"

[project.entry-points."omnitool.plugin"]
git = "omnitool.builtin_plugins.git.plugin:definition"

[tool.poetry]
packages = [
    { include = "omnitool" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-mock = "^3.14.0"
factory-boy = "^3.3.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
